# Builds LethalMenu.dll on every push and pull request.
# The game isn't installed on GitHub's machines, so the project uses the community's reference packages
# (LethalCompany.GameLibs.Steam + BepInEx.Core) instead - see LethalMenu.csproj.
# Download the DLL from the run's "Artifacts" section. Pushing a tag like v1.4.8 also makes a Release with it.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to attach the DLL to a Release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build LethalMenu.csproj -c Release -p:UseGameLibsPackage=true -p:DeployToBepInEx=false

      - name: Upload LethalMenu.dll
        uses: actions/upload-artifact@v5
        with:
          name: LethalMenu
          path: bin/Release/netstandard2.1/LethalMenu.dll
          if-no-files-found: error

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/Release/netstandard2.1/LethalMenu.dll --title "$GITHUB_REF_NAME" --generate-notes
